# zipapkbuilder-workflow: 3
name: Build APK

on:
  push:
    branches: [ main, master ]
    # Any push builds, except one that only touches workflow files or docs. A pushed ZIP is
    # built from the ZIP; a push without a ZIP (a Sync commit, an edit made on GitHub) builds
    # the repo's own files. The app's housekeeping commits carry [skip ci].
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      source:
        description: 'What to build: auto (newest ZIP if there is one, else the repo files), zip, or repo'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache NDK and CMake
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
            ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: ndk-25.2.9519653-25.1.8937393-cmake-3.22.1

      - name: Install NDK and CMake
        run: |
          for NDK_VER in "25.2.9519653" "25.1.8937393"; do
            if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VER" ]; then
              echo "Installing NDK $NDK_VER..."
              sdkmanager --install "ndk;$NDK_VER"
            else
              echo "NDK $NDK_VER already present"
            fi
          done
          if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ]; then
            sdkmanager --install "cmake;3.22.1"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: Choose what to build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=""
          MODE="repo"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A push is built from the ZIP its own commit added, so an older ZIP that is
            # still in the repository is never picked by mistake. A push that added no ZIP
            # (a Sync commit, an edit made on GitHub) builds the repository's own files.
            ADDED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.files[] | select(.status != "removed") | .filename' 2>/dev/null \
              | grep -i '\.zip$' | head -1 || true)
            if [ -n "$ADDED" ] && [ -f "$ADDED" ]; then ZIP="./$ADDED"; MODE="zip"; fi
          else
            # Manual run: the source input is read from the event file.
            SOURCE=$(jq -r '.inputs.source // "auto"' "$GITHUB_EVENT_PATH")
            if [ "$SOURCE" != "repo" ]; then
              ZIP=$(find . -maxdepth 3 -path ./.git -prune -o -name "*.zip" -type f -printf "%T@ %p\n" | sort -rn | head -1 | cut -d" " -f2-)
              if [ -n "$ZIP" ]; then MODE="zip"; fi
              if [ "$SOURCE" = "zip" ] && [ -z "$ZIP" ]; then
                echo "##[error]No ZIP file found in repository!"
                exit 1
              fi
            fi
          fi
          echo "build_mode=$MODE" >> "$GITHUB_ENV"
          if [ "$MODE" = "zip" ]; then
            COUNT=$(find . -maxdepth 3 -path ./.git -prune -o -name "*.zip" -type f -print | wc -l)
            if [ "$COUNT" -gt 1 ]; then
              echo "::warning::$COUNT ZIP files found in the repository - building $ZIP"
            fi
            ZIP_NAME=$(basename "$ZIP" .zip)
            echo "zip_name=$ZIP_NAME" >> "$GITHUB_ENV"
            echo "zip_path=$ZIP" >> "$GITHUB_ENV"
            echo "build_root=extracted" >> "$GITHUB_ENV"
            echo "Found zip: $ZIP"
            unzip -q "$ZIP" -d extracted
          else
            echo "No ZIP involved - building the repository's own files"
            echo "zip_name=$(basename "$GITHUB_REPOSITORY")" >> "$GITHUB_ENV"
            echo "zip_path=" >> "$GITHUB_ENV"
            echo "build_root=." >> "$GITHUB_ENV"
          fi

      - name: Find project directory
        id: find_project
        run: |
          ROOT="$build_root"
          RESULT=$(find "$ROOT" -maxdepth 4 -not -path "./.git/*" -not -path "*/__MACOSX/*" \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf "%d %p\n" | sort -n | head -1 | cut -d" " -f2-)
          if [ -z "$RESULT" ]; then
            if [ "$build_mode" = "zip" ]; then
              echo "##[error]No settings.gradle found inside the zip!"
            else
              echo "##[error]No settings.gradle found in the repository - sync the project files first."
            fi
            find "$ROOT" -not -path "./.git/*" | sort | head -200
            exit 1
          fi
          PROJECT_DIR=$(dirname "$RESULT")
          echo "Found project at: $PROJECT_DIR"
          # A ZIP made in Android Studio often carries a local.properties whose sdk.dir points at
          # the author's own machine. That path does not exist here and Gradle refuses to start.
          rm -f "$PROJECT_DIR/local.properties"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Cache Rust builds (only for projects that contain Rust code)
        if: hashFiles('**/Cargo.toml') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ steps.find_project.outputs.project_dir }}/app/src/main/rust/zipsync/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache CMake / C++ build outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.find_project.outputs.project_dir }}/app/.cxx
          key: cxx-debug-${{ hashFiles('**/CMakeLists.txt', '**/core/*.cpp', '**/core/*.h', '**/jni_bridge.cpp') }}
          restore-keys: cxx-debug-

      - name: Fetch gradle-wrapper.jar
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          GRADLE_VERSION="8.6"
          JAR="gradle/wrapper/gradle-wrapper.jar"
          mkdir -p gradle/wrapper
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o "$JAR"
          SIZE=$(stat -c%s "$JAR")
          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: gradle-wrapper.jar too small (${SIZE} bytes)"
            exit 1
          fi

      - name: Make gradlew executable
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: chmod +x gradlew && sed -i 's/\r//' gradlew

      - name: Decode keystore (if available)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Keystore decoded"
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret — building debug APK"
          fi

      - name: Build APK
        id: build
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --configuration-cache --build-cache --parallel \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleDebug --no-daemon --configuration-cache --build-cache --parallel
          fi

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
            echo "APK type: release"
          else
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
            echo "APK type: debug"
          fi
          if [ -z "$APK_PATH" ]; then
            echo "##[error]No APK found. Is the application module named 'app'?"
            find app/build/outputs -maxdepth 4 2>/dev/null | head -50
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}-${{ env.HAS_KEYSTORE == 'true' && 'release' || 'debug' }}-v${{ github.run_number }}
          path: ${{ steps.find_project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Clean up - delete zip after the build
        if: success() || failure()
        continue-on-error: true
        run: |
          ZIP="$zip_path"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -q -- "$ZIP"
            git commit -q -m "ci: remove $ZIP after build #${{ github.run_number }} [skip ci]"
            git pull --rebase -q origin "$GITHUB_REF_NAME" || true
            git push
          fi